version: "3.8"

x-n8n-env-common: &n8n-env-common
  # Modo fila
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_DB: 1 # DB lógico separado do que o Evolution API usa no Redis (DB 0)
  # Banco de dados dedicado do n8n (separado do banco do Evolution API)
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  # Chave de criptografia: TEM que ser idêntica em main, webhook e worker
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

x-n8n-common: &n8n-common
  image: n8nio/n8n:latest
  restart: always
  volumes:
    - n8n-data:/home/node/.n8n
  networks:
    - private-bridge
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    n8n-db-init:
      condition: service_completed_successfully

services:
  traefik:
    container_name: traefik
    image: "traefik:v3.0"
    restart: always
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    command:
      # Desativado o mode insecure e habilitado o dashboard interno
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=private-bridge"

      # Entrypoints HTTP e HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Redirecionamento automático de HTTP para HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # SSL Let's Encrypt via Desafio DNS do DuckDNS
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=duckdns"
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL:-seu-email@dominio.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    labels:
      - "traefik.enable=true"
      # Roteador do Dashboard do Traefik
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik-performa-ia.duckdns.org`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # Autenticação Básica (Obrigatório para segurança)
      # Usuário padrão abaixo: admin / senha: adminpassword (gerado via htpasswd - crie a sua hash)
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$apr1$$0eHZ7PMa$$FIfgaD9NrTTue1Pcu5o/p/"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - private-bridge

  # ---------------------------------------------------------------
  # Cria a database "n8n" dentro do Postgres existente, se ainda não
  # existir. Roda sozinho a cada "docker compose up" (idempotente) -
  # nenhum comando manual necessário. Sai após criar/confirmar.
  # ---------------------------------------------------------------
  n8n-db-init:
    container_name: n8n-db-init
    image: postgres:16-alpine
    restart: "no"
    networks:
      - private-bridge
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        psql -tc "SELECT 1 FROM pg_database WHERE datname = 'n8n'" | grep -q 1 ||
        psql -c "CREATE DATABASE n8n"

  # ---------------------------------------------------------------
  # n8n - instância PRINCIPAL (editor, API, triggers de cron/polling)
  # Produção de webhooks desativada aqui: quem atende é o n8n-webhook
  # ---------------------------------------------------------------
  n8n-main:
    <<: *n8n-common
    container_name: n8n-main
    command: start
    environment:
      <<: *n8n-env-common
      N8N_HOST: performa-ia.duckdns.org
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://performa-ia.duckdns.org:8443/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-main.rule=Host(`performa-ia.duckdns.org`)"
      - "traefik.http.routers.n8n-main.entrypoints=websecure"
      - "traefik.http.routers.n8n-main.tls=true"
      - "traefik.http.routers.n8n-main.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-main.priority=1"
      - "traefik.http.services.n8n-main.loadbalancer.server.port=5678"
      - "traefik.docker.network=private-bridge"

  # ---------------------------------------------------------------
  # n8n - WEBHOOK dedicado: recebe só /webhook/*, /webhook-waiting/* e /form/*
  # (testes manuais em /webhook-test/* continuam indo para o main)
  # ---------------------------------------------------------------
  n8n-webhook:
    <<: *n8n-common
    container_name: n8n-webhook
    command: webhook
    environment:
      <<: *n8n-env-common
      WEBHOOK_URL: https://performa-ia.duckdns.org:8443/
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-webhook.rule=Host(`performa-ia.duckdns.org`) && (PathPrefix(`/webhook/`) || PathPrefix(`/webhook-waiting/`) || PathPrefix(`/form/`))"
      - "traefik.http.routers.n8n-webhook.entrypoints=websecure"
      - "traefik.http.routers.n8n-webhook.tls=true"
      - "traefik.http.routers.n8n-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-webhook.priority=100"
      - "traefik.http.services.n8n-webhook.loadbalancer.server.port=5678"
      - "traefik.docker.network=private-bridge"

  # ---------------------------------------------------------------
  # n8n - WORKER: processa as execuções da fila. Sem container_name
  # para poder escalar: docker compose up -d --scale n8n-worker=3
  # ---------------------------------------------------------------
  n8n-worker:
    <<: *n8n-common
    command: worker
    environment:
      <<: *n8n-env-common

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`api-performa-ia.duckdns.org`)"
      - "traefik.http.routers.evolution.entrypoints=websecure"
      - "traefik.http.routers.evolution.tls=true"
      - "traefik.http.routers.evolution.tls.certresolver=letsencrypt"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
      - "traefik.docker.network=private-bridge"
      - "traefik.http.middlewares.evolution-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.evolution-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.evolution-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.routers.evolution.middlewares=evolution-cors"
      - "traefik.http.services.evolution.loadbalancer.passHostHeader=true"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - private-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
      - "8000:8000"
    networks:
      - private-bridge

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    expose:
      - "5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private-bridge

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private-bridge

networks:
  private-bridge:
    driver: bridge

volumes:
  evolution_instances:
  portainer_data:
  postgres-volume:
  redis-volume:
  n8n-data:
  traefik_certs:
