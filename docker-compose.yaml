# =====================================================================
# Stack Performa IA - n8n (fila) + Evolution API + Postgres + Redis
# + Traefik + Portainer + Asterisk (discador)
#
# Versão "rede interna / pronta para VPS" (06/11/2026).
# Nada de domínio, IP ou senha fixo aqui: tudo vem do .env (compose)
# e do evolution.env (só da Evolution). O mesmo arquivo roda no Mac e
# na VPS; muda só o .env. É também o template que a futura plataforma
# (Spring Boot) vai preencher por cliente.
#
# Redes:
#   private-bridge (= ${SHARED_NETWORK}): Traefik e quem tem rota pública ou
#          precisa falar com outro app (n8n, Evolution, Chatwoot,
#          Asterisk, Portainer). Nome fixo para as outras stacks.
#   data  (internal: true)      : só Postgres/Redis e quem usa banco.
#          Sem saída para a internet e invisível para Traefik,
#          Chatwoot e Asterisk.
#
# URLs internas (use estas entre serviços, nunca o DuckDNS):
#   n8n webhooks ...... http://n8n-webhook:5678/webhook/<path>
#   n8n editor/API .... http://n8n-main:5678
#   Evolution API ..... http://evolution-api:8080
#   Chatwoot .......... http://chatwoot-rails:3000   (stack chatwoot)
#   Asterisk ARI ...... http://asterisk:8088/ari
# =====================================================================

# Mantém o nome atual do projeto: os volumes continuam sendo
# docker-n8n_postgres-volume etc. (não perde dados no Mac).
name: ${STACK_NAME:-docker-n8n}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-n8n-env-common: &n8n-env-common
  # Modo fila
  EXECUTIONS_MODE: queue
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_DB: 1 # DB 0 = Evolution
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  # Banco do n8n
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  # Obrigatória e idêntica em main/webhook/worker. Hoje ela só existe
  # dentro do volume n8n-data; copie para o .env antes de migrar (README).
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
  # Endereço público (o que aparece nos nodes Webhook e callbacks OAuth)
  WEBHOOK_URL: https://${N8N_HOST}${PUBLIC_PORT_SUFFIX:-}/
  N8N_PROXY_HOPS: 1
  GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
  TZ: ${TZ:-America/Sao_Paulo}
  # Limpeza automática do histórico de execuções (14 dias)
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: 336

x-n8n-common: &n8n-common
  image: ${N8N_IMAGE:-n8nio/n8n:latest}
  restart: always
  logging: *logging
  volumes:
    - n8n-data:/home/node/.n8n
  networks:
    - private-bridge
    - data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    n8n-db-init:
      condition: service_completed_successfully

services:
  traefik:
    container_name: traefik
    image: ${TRAEFIK_IMAGE:-traefik:v3.0}
    restart: always
    logging: *logging
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Nome REAL da rede (com prefixo). Com containers em 2 redes, um
      # nome errado aqui faz o Traefik mirar o IP da rede "data" (502).
      - "--providers.docker.network=${SHARED_NETWORK:-docker-n8n_private-bridge}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-duckdns}"
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      # Hash htpasswd no .env (troque o atual, que veio do exemplo)
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASICAUTH}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - private-bridge

  # Cria a database "n8n" se não existir (idempotente) e sai.
  n8n-db-init:
    container_name: n8n-db-init
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: "no"
    networks:
      - data
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        psql -tc "SELECT 1 FROM pg_database WHERE datname = 'n8n'" | grep -q 1 ||
        psql -c "CREATE DATABASE n8n"

  # n8n PRINCIPAL: editor, API, cron/polling
  n8n-main:
    <<: *n8n-common
    container_name: n8n-main
    command: start
    environment:
      <<: *n8n-env-common
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-main.rule=Host(`${N8N_HOST}`)"
      - "traefik.http.routers.n8n-main.entrypoints=websecure"
      - "traefik.http.routers.n8n-main.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-main.priority=1"
      - "traefik.http.services.n8n-main.loadbalancer.server.port=5678"
      - "traefik.docker.network=${SHARED_NETWORK:-docker-n8n_private-bridge}"

  # n8n WEBHOOK: /webhook/*, /webhook-waiting/*, /form/*
  # Internamente: http://n8n-webhook:5678/webhook/<path>
  n8n-webhook:
    <<: *n8n-common
    container_name: n8n-webhook
    command: webhook
    environment:
      <<: *n8n-env-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-webhook.rule=Host(`${N8N_HOST}`) && (PathPrefix(`/webhook/`) || PathPrefix(`/webhook-waiting/`) || PathPrefix(`/form/`))"
      - "traefik.http.routers.n8n-webhook.entrypoints=websecure"
      - "traefik.http.routers.n8n-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-webhook.priority=100"
      - "traefik.http.services.n8n-webhook.loadbalancer.server.port=5678"
      - "traefik.docker.network=${SHARED_NETWORK:-docker-n8n_private-bridge}"

  # n8n WORKER (escalável): docker compose up -d --scale n8n-worker=3
  n8n-worker:
    <<: *n8n-common
    command: worker
    environment:
      <<: *n8n-env-common

  # Evolution API. Só recebe o evolution.env (não o .env inteiro, que
  # tem token DuckDNS, senha SIP etc.). Endereços e banco vêm daqui.
  evolution-api:
    container_name: evolution_api
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:latest}
    restart: always
    logging: *logging
    expose:
      - "8080"
    env_file:
      - evolution.env
    environment:
      SERVER_URL: https://${EVOLUTION_HOST}${PUBLIC_PORT_SUFFIX:-}
      DATABASE_PROVIDER: postgresql
      # Senha com caractere especial (@ : / #) precisa ir URL-encoded
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      TZ: ${TZ:-America/Sao_Paulo}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`${EVOLUTION_HOST}`)"
      - "traefik.http.routers.evolution.entrypoints=websecure"
      - "traefik.http.routers.evolution.tls.certresolver=letsencrypt"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
      - "traefik.http.services.evolution.loadbalancer.passHostHeader=true"
      - "traefik.docker.network=${SHARED_NETWORK:-docker-n8n_private-bridge}"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - private-bridge
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Portainer atrás do Traefik (sem portas 9443/8000 abertas na internet)
  portainer:
    container_name: portainer
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:lts}
    restart: always
    logging: *logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    # Alternativa sem domínio: apague os labels e use só
    #   ports: ["127.0.0.1:9443:9443"]   + túnel SSH
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=${SHARED_NETWORK:-docker-n8n_private-bridge}"
    networks:
      - private-bridge

  postgres:
    container_name: postgres
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: always
    logging: *logging
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    container_name: redis
    image: ${REDIS_IMAGE:-redis:alpine}
    restart: always
    logging: *logging
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    volumes:
      - redis-volume:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  # Discador. n8n chama http://asterisk:8088/ari pela rede private-bridge.
  # Na VPS: SIP_EXTERNAL_IP = IP público da VPS e libere 5060/RTP no
  # firewall SÓ para o IP do 3CX.
  # asterisk:
  #   image: ${ASTERISK_IMAGE:-performa/asterisk-discador:1.0}
  #   container_name: asterisk
  #   restart: unless-stopped
  #   logging: *logging
  #   environment:
  #     SIP_EXTERNAL_IP: ${SIP_EXTERNAL_IP}
  #     PBX_HOST: ${PBX_HOST}
  #     PBX_PORT: ${PBX_PORT:-5060}
  #     PBX_NAME: ${PBX_NAME:-3cx}
  #     DIALER_EXT: ${DIALER_EXT:-950}
  #     SIP_AUTH_ID: ${SIP_AUTH_ID}
  #     SIP_PASSWORD: ${SIP_PASSWORD}
  #     ARI_USER: ${ARI_USER:-n8n}
  #     ARI_PASSWORD: ${ARI_PASSWORD}
  #     LOCAL_NET: ${LOCAL_NET:-172.16.0.0/12}
  #     RTP_START: ${RTP_START:-10000}
  #     RTP_END: ${RTP_END:-10050}
  #     DIAL_TIMEOUT: ${DIAL_TIMEOUT:-45}
  #   ports:
  #     - "5060:5060/udp"
  #     - "${RTP_START:-10000}-${RTP_END:-10050}:${RTP_START:-10000}-${RTP_END:-10050}/udp"
  #   networks:
  #     - private-bridge

networks:
  # Mesma chave e mesmo nome de hoje: Chatwoot e Asterisk continuam
  # achando a rede por "docker-n8n_private-bridge".
  private-bridge:
    name: ${SHARED_NETWORK:-docker-n8n_private-bridge}
    driver: bridge
  data:
    name: ${STACK_NAME:-docker-n8n}_data
    driver: bridge
    internal: true

volumes:
  evolution_instances:
  portainer_data:
  postgres-volume:
  redis-volume:
  n8n-data:
  traefik_certs:
