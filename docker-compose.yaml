version: "3.8"

services:
  traefik:
    container_name: traefik
    image: "traefik:v3.0"
    restart: always
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    command:
      # Desativado o mode insecure e habilitado o dashboard interno
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=private-bridge"
      
      # Entrypoints HTTP e HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      
      # Redirecionamento automático de HTTP para HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      
      # SSL Let's Encrypt via Desafio DNS do DuckDNS
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=duckdns"
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL:-seu-email@dominio.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    ports:
      - "80:80"
      - "443:443"
    labels:
      - "traefik.enable=true"
      # Roteador do Dashboard do Traefik
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik-performa-ia.duckdns.org`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # Autenticação Básica (Obrigatório para segurança)
      # Usuário padrão abaixo: admin / senha: adminpassword (gerado via htpasswd - crie a sua hash)
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$apr1$$0eHZ7PMa$$FIfgaD9NrTTue1Pcu5o/p/"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - private-bridge

  n8n:
    container_name: n8n
    image: n8nio/n8n:latest
    restart: always
    environment:
      - N8N_HOST=performa-ia.duckdns.org
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://performa-ia.duckdns.org/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`performa-ia.duckdns.org`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=private-bridge"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - private-bridge

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.1.1
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`api-performa-ia.duckdns.org`)"
      - "traefik.http.routers.evolution.entrypoints=websecure"
      - "traefik.http.routers.evolution.tls=true"
      - "traefik.http.routers.evolution.tls.certresolver=letsencrypt"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
      - "traefik.docker.network=private-bridge"
      - "traefik.http.middlewares.evolution-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.evolution-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.evolution-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.routers.evolution.middlewares=evolution-cors"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - private-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
      - "8000:8000"
    networks:
      - private-bridge

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    expose:
      - "5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private-bridge

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private-bridge

networks:
  private-bridge:
    driver: bridge

volumes:
  evolution_instances:
  portainer_data:
  postgres-volume:
  redis-volume:
  n8n-data:
  traefik_certs: